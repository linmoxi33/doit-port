[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doit-port"
version = "0.1.1"
description = "Portable, content-addressed build receipts for doit: carry your incremental build cache across machines and CI runs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "linmoxi33", email = "linmoxi33@users.noreply.github.com" }]
keywords = ["doit", "build-cache", "incremental", "reproducible", "automation", "workflow", "content-addressed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = ["doit>=0.36"]

[project.optional-dependencies]
toml310 = ["tomli; python_version < '3.11'"]
test = ["pytest>=8.0", "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/linmoxi33/doit-port"
Documentation = "https://github.com/linmoxi33/doit-port#readme"
Source = "https://github.com/linmoxi33/doit-port"
Issues = "https://github.com/linmoxi33/doit-port/issues"

# The documented extension point: doit's PluginDict loads this group through
# importlib.metadata and registers the class as `doit port`.
[project.entry-points."doit.COMMAND"]
port = "doit_port.command:PortCommand"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# An unhandled exception in a worker thread used to be a warning that pytest
# printed and moved on from. It is a failure: make it one.
filterwarnings = [
    "error::DeprecationWarning:doit_port.*",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    # An invalid escape sequence is a SyntaxWarning since 3.12 and silently
    # becomes an error in a future release; catch it while it is cheap.
    "error::SyntaxWarning",
]
