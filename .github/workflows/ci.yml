name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `toml310` brings tomli on 3.10 only; the example reads audit.toml.
          python -m pip install -e ".[test,toml310]"

      # The suite spawns `python -m doit` as a subprocess, so the CLI has to be
      # importable from a clean interpreter, not only from pytest's sys.path.
      # Compiles every .py in the tree, including ones pytest never imports
      # (tools/, example helpers). SyntaxWarning -> error, same as pytest.
      - name: Compile check
        run: python -W error::SyntaxWarning -m compileall -q src tests tools examples

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: CLI entry point is registered
        run: python -m doit port status

  reproducibility:
    name: reproducible zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,toml310]" build

      # Building the archive twice must produce identical bytes; the tool fails
      # the job otherwise. Catches stray timestamps, ordering and CRLF leakage.
      - name: Build archive twice and compare
        run: python tools/build_archive.py --check

      # Installs the wheel into a throwaway environment and runs the example
      # from there: proves the packaged artefact works, not just the source tree.
      - name: Wheel smoke test
        run: |
          python -m build --wheel
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install --quiet dist/*.whl
          cd examples/codeaudit
          rm -rf build audit .doit-port .doit.db
          /tmp/wv/bin/python -m doit all
          /tmp/wv/bin/python -m doit all | tee /tmp/second.txt
          grep -q '^-- ' /tmp/second.txt
          test -f build/gate.txt

  mutation:
    name: mutation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,toml310]"

      # This is the job that actually guards correctness: it proves the suite
      # notices twenty-one plausible defects. It is slow on purpose.
      - name: Inject defects, expect a red suite each time
        run: python tools/mutation_check.py
